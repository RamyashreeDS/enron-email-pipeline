[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "enron-pipeline"
version = "0.1.0"
description = "Extract, store, deduplicate and notify on the Enron email dataset"
requires-python = ">=3.10"
dependencies = ["rapidfuzz>=3.0", "mcp>=2.3,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
